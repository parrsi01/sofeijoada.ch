server {
    server_name sofeijoada.ch www.sofeijoada.ch;
    client_max_body_size 32k;
    server_tokens off;

    if ($host = www.sofeijoada.ch) {
        return 301 https://sofeijoada.ch$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sofeijoada.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sofeijoada.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sofeijoada.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sofeijoada.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sofeijoada.ch www.sofeijoada.ch;
    return 404; # managed by Certbot




}